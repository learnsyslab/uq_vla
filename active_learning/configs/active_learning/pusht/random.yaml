# Push-T active fine-tuning with the FM-Policy (flow_matching). Random: episodes drawn uniformly at random.
# Two-member ensemble pretrained on 50 of the 206 demonstrations (configs/pretrain/fm_pusht.yaml);
# all 206 are candidates. 30 rounds x 5 episodes, 2000 steps per round, batch 128, replay 30% D_pre.
dataset:
  repo_id: lerobot/pusht
  video_backend: pyav
  pusht_tasks:
    pusht: [0]

policy:
  scheduler_warmup_steps: 100
  type: flow_matching
  device: cuda:0
  pretrained_path: outputs/pretrain/fm_pusht/seed_${SEED_A}/checkpoints/last/pretrained_model

paths:
  env_file: .env
  run_root: outputs/active_learning/pusht
  run_name: random_${SEED_PAIR}

iteration:
  total_rounds: 30
  episodes_per_round: 5
  bootstrap_selection_paths: []
  warm_start_from_previous_round: true

replay:
  history_fraction: 0.3
  new_fraction: 0.7
  sampling_mode: weighted_pools
  history_tasks:
    pusht: [0]   # required for validation; actual replay set below
  samples_per_epoch: 20000
  replacement: true

selection:
  strategy: random
  uncertainty_method: cross_bayesian   # unused by random strategy
  scorer_type: ensemble
  scoring_metric: inter_vel_diff_2way   # VFD (2-way)
  num_action_samples: 5
  observation_batch_size: 32
  ensemble_model_paths:
    - outputs/pretrain/fm_pusht/seed_${SEED_A}/checkpoints/last/pretrained_model
    - outputs/pretrain/fm_pusht/seed_${SEED_B}/checkpoints/last/pretrained_model
  candidate_tasks:
    pusht: [0]           # all 206 Push-T episodes are candidates
  max_candidates_per_task: null
  max_selected_per_task: null
  device: cuda:0

execution:
  stages: [select, train]
  resume: true
  overwrite_existing_round: false
  save_candidate_scores: true

ensemble_training:
  parallel_members: false      # single GPU: train the 2 members sequentially
  member_devices: [cuda:0]

reinitialize_selected_layers: false
num_workers: 8
batch_size: 128
steps: 2000
eval_freq: 0
log_freq: 20
save_checkpoint: true
save_freq: 10000
use_policy_training_preset: true
rename_map: {}

wandb:
  enable: false

# One job per seed pair: pick it with --seed_pair=<name> or SEED_PAIR=<name>. `members` are the
# pretraining seeds of the two ensemble members (${SEED_A}, ${SEED_B} above); `seed` and
# `selection_seed` are the training and selection seeds, `history_episode_ids` the pair's 50
# pretraining episodes (each pair was pretrained on its own random subset of the 206).

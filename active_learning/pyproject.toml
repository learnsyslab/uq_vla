[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# Code for the calibration, active fine-tuning and failure-detection rollouts of the paper. src/lerobot is
# a modified copy of LeRobot 0.4.3 (Apache-2.0, https://github.com/huggingface/lerobot) reduced to the
# policies (SmolVLA, X-VLA, FastWAM, a flow-matching policy) and environments (LIBERO, Push-T) used here,
# with the uncertainty estimation and rollout recording added; src/iterative_fine_tuning is the
# iterative active fine-tuning pipeline.
[project]
name = "vfd-active-learning"
version = "0.1.0"
description = "Velocity-field disagreement for calibration, active fine-tuning and failure detection of flow-matching policies"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [

    # Hugging Face dependencies
    "datasets>=4.0.0,<4.2.0",
    "diffusers>=0.27.2,<0.36.0",
    "huggingface-hub[hf-transfer,cli]>=0.34.2,<0.36.0",
    "accelerate>=1.10.0,<2.0.0",

    # Core dependencies
    "setuptools>=71.0.0,<81.0.0",
    "cmake>=3.29.0.1,<4.2.0",
    "einops>=0.8.0,<0.9.0",
    "python-dotenv>=1.0.0",  # used by src/iterative_fine_tuning (.env loading)
    "opencv-python-headless>=4.9.0,<4.12",
    "av>=15.0.0,<16.0.0",
    "packaging>=24.2,<26.0",
    "wandb>=0.20.0,<0.22.0",

    "torch>=2.2.1,<2.8.0",
    "torchcodec>=0.2.1,<0.6.0; sys_platform != 'win32' and (sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')) and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "torchvision>=0.21.0,<0.23.0",
    "torchdiffeq>=0.2.3",

    "draccus==0.10.0",
    "gymnasium>=1.1.1,<2.0.0",
    "rerun-sdk>=0.21.0,<0.23.0",

    # Support dependencies
    "deepdiff>=7.0.1,<9.0.0",
    "imageio[ffmpeg]>=2.34.0,<3.0.0",
    "termcolor>=2.4.0,<4.0.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
smolvla = ["transformers>=4.53.0,<5.0.0", "num2words>=0.5.14,<0.6.0", "safetensors>=0.4.3,<1.0.0"]
xvla = ["transformers>=4.53.0,<5.0.0"]
fastwam = ["transformers>=4.53.0,<5.0.0"]  # diffusers (AutoencoderKLWan) is a core dependency
libero = ["transformers>=4.53.0,<5.0.0", "hf-libero>=0.1.3,<0.2.0"]
pusht = ["gym-pusht>=0.1.5,<0.2.0", "pymunk>=6.6.0,<7.0.0"]
uncertainty = ["laplace-torch==0.2.2.2", "curvlinops-for-pytorch==2.0.1"]
plots = ["tueplots>=0.2.4"]
libero_plus = ["gym==0.26.2", "numba"]
failure_detection = ["hydra-core>=1.3", "omegaconf>=2.3", "tqdm"]
test = ["pytest>=8.1.0,<9.0.0"]
all = [
    "vfd-active-learning[smolvla]",
    "vfd-active-learning[xvla]",
    "vfd-active-learning[fastwam]",
    "vfd-active-learning[libero]",
    "vfd-active-learning[pusht]",
    "vfd-active-learning[uncertainty]",
    "vfd-active-learning[plots]",
    "vfd-active-learning[failure_detection]",
    "vfd-active-learning[test]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.bddl", "*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 110
